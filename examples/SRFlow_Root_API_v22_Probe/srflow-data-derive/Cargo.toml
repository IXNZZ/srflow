[package]
name = "srflow-data-derive"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
description = "Data derive macro for SRFlow"
license = "MIT"
publish = false

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
syn = { version = "2.0", features = ["derive"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
