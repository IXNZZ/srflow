[package]
name = "srflow"
# 重写阶段的工程版本；正式发布范围与版本另行确定。
version = "0.0.1"
edition = "2024"
# 当前工具链基线为 1.97；更低版本支持须另行验证。
rust-version = "1.97"
description = "SRFlow: a strongly-typed execution framework centered on sequential flows"
license = "MIT"

# 当前核心保持零普通依赖；异步适配与线程约束按 v2.1 任务落实。
[dependencies]

[dev-dependencies]
# 仅用于测试与示例中驱动异步代码。选择 `futures` 是因为它不提供全局运行时，
# 与“核心不强制绑定某个 executor”的约束一致，也比引入完整异步运行时更小。
futures = { version = "0.3", default-features = false, features = ["executor"] }
